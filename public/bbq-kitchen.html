<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBQ Kitchen Display</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;background:#111827;color:#f9fafb}body{margin:0}header{background:#1f2937;padding:24px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{margin:0}button{border:0;border-radius:9px;padding:12px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#374151}main{padding:20px;max-width:1400px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:14px;background:#374151;border-radius:12px}.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px;margin-top:20px}.ticket{background:#1f2937;border:1px solid #4b5563;padding:18px;border-radius:13px}.ticket p{font-size:17px}.badge{color:#fde68a}.ready{color:#6ee7b7}.buttons{display:flex;gap:8px;flex-wrap:wrap}#error{color:#fca5a5}</style></head><body><header><div><h1>BBQ — Kitchen Display</h1><p>KOT preparation only · no billing or payments</p></div><div><button id="sound" class="secondary">Enable Sound</button> <button id="reload" class="secondary">Refresh</button></div><button type="button" id="logout">Sign out</button></header><main><p id="error" role="alert"></p><div class="stats"><div class="stat">New: <strong id="newCount">0</strong></div><div class="stat">Preparing: <strong id="prepCount">0</strong></div><div class="stat">Ready: <strong id="readyCount">0</strong></div></div><section id="tickets" class="orders"></section><p>Updates every 15 seconds. Kitchen users can change preparation status only.</p></main><script src="/js/bbq-kitchen.js"></script><script src="/js/bbq-logout.js"></script></body></html>
